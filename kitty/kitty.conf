# Palette matched to the desktop base in quickshell/Theme.qml (#141C21 / #93A1A1)
# and the ANSI colours the bar already uses.
#
# Cursor and selection colours come from the wallpaper via matugen
# (kitty/colors.conf). kitty re-reads its config on save, so set-wallpaper.sh
# recolours open terminals with no restart. This file is included last so it
# still wins over anything in the generated one.
include colors.conf

background #141C21
foreground #93A1A1

color0  #141C21
color8  #3C4449
color1  #EC7875
color9  #EC407A
color2  #61C766
color10 #8BD48F
color3  #FDD835
color11 #FFE082
color4  #42A5F5
color12 #64B5F6
color5  #BA68C8
color13 #CE93D8
color6  #4DD0E1
color14 #00B19F
color7  #93A1A1
color15 #CDD6D6

# MesloLGS NF everywhere: quickshell (bar, notifications, panels), rofi,
# hyprlock and the Hyprland groupbar all use it now, one font across the rice.
font_family      MesloLGS NF
bold_font        MesloLGS NF Bold
italic_font      MesloLGS NF Italic
bold_italic_font MesloLGS NF Bold Italic
font_size 13.0

# Transparency is NOT set here: hypr/hyprland.lua carries a windowrule
# (opacity 0.95 focused / 0.85 unfocused) so the two states differ, and
# Hyprland's blur renders behind it. Setting background_opacity too would
# multiply with that rule and make unfocused terminals nearly invisible.
background_opacity 1.0

# top/bottom left/right -- matches alacritty's old x=10, y=8 padding.
window_padding_width 8 10

wheel_scroll_multiplier 3.0

map shift+enter send_text all \x1b\r
