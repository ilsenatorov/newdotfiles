# Every colour comes from kitty/colors.conf, generated by matugen: cursor and
# selection from the wallpaper, background/foreground/ANSI palette from the
# fixed desktop base in matugen/base.json. kitty re-reads its config on save,
# so set-wallpaper.sh recolours open terminals with no restart. Anything set
# below the include still wins over the generated file.
include colors.conf

# MesloLGS NF everywhere: quickshell (bar, notifications, panels, menus),
# hyprlock and the Hyprland groupbar all use it now, one font across the rice.
font_family      MesloLGS NF
bold_font        MesloLGS NF Bold
italic_font      MesloLGS NF Italic
bold_italic_font MesloLGS NF Bold Italic
font_size 13.0

# Transparency is NOT set here: hypr/hyprland.lua carries a windowrule
# (opacity 0.95 focused / 0.85 unfocused) so the two states differ, and
# Hyprland's blur renders behind it. Setting background_opacity too would
# multiply with that rule and make unfocused terminals nearly invisible.
background_opacity 1.0

# top/bottom left/right -- matches alacritty's old x=10, y=8 padding.
window_padding_width 8 10

wheel_scroll_multiplier 3.0

map shift+enter send_text all \x1b\r

# Don't warn about pasting multi-line/bash-looking text, and don't warn
# when closing a window/tab/OS window with a process still running.
paste_actions quote-urls-at-prompt
confirm_os_window_close 0
