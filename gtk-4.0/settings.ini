# GTK4 reads this file; libadwaita apps additionally (and mostly) follow the
# org.gnome.desktop.interface gsettings keys, which hypr/scripts/gsettings-theme.sh
# sets at session start. Keep the two in agreement.
#
# gtk-theme-name is deliberately absent: libadwaita ignores GTK themes entirely
# and is styled through colors below + prefer-dark.
[Settings]
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Cantarell 11
gtk-decoration-layout=:close
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
