# Palette matched to the desktop base in waybar/style.css (#141C21 / #93A1A1)
# and the ANSI colours the bar already uses -- this was Tokyo Night (#24283b /
# #a9b1d6) before, the only surface left outside the theme.
#
# Cursor, selection, search and hint colours come from the wallpaper via matugen
# (alacritty/colors.toml). Alacritty merges imports first and lets THIS file
# win, so anything set below overrides the generated file; alacritty watches the
# config and live-reloads, so set-wallpaper.sh recolours open terminals.
[general]
import = ["~/.config/alacritty/colors.toml"]

[colors.primary]
background = "#141C21"
foreground = "#93A1A1"
dim_foreground = "#6D8895"

[colors.normal]
black   = "#141C21"
red     = "#EC7875"
green   = "#61C766"
yellow  = "#FDD835"
blue    = "#42A5F5"
magenta = "#BA68C8"
cyan    = "#4DD0E1"
white   = "#93A1A1"

[colors.bright]
black   = "#3C4449"
red     = "#EC407A"
green   = "#8BD48F"
yellow  = "#FFE082"
blue    = "#64B5F6"
magenta = "#CE93D8"
cyan    = "#00B19F"
white   = "#CDD6D6"

[font]
size = 13.0

# Iosevka Nerd Font everywhere: waybar, mako, rofi, hyprlock and the Hyprland
# groupbar all use it. MesloLGS NF stays installed as the p10k glyph fallback.
[font.normal]
family = "MesloLGS NF"
style = "Regular"

[font.bold]
family = "MesloLGS NF"
style = "Bold"

[font.italic]
family = "MesloLGS NF"
style = "Italic"

[window]
# Transparency is NOT set here: hypr/hyprland.lua carries a windowrule
# (opacity 0.95 focused / 0.85 unfocused) so the two states differ, and
# Hyprland's blur renders behind it. Setting window.opacity too would multiply
# with that rule and make unfocused terminals nearly invisible.
opacity = 0.85
padding = { x = 10, y = 8 }
dynamic_padding = true

[scrolling]
multiplier = 3

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
