# matugen drives the ACCENT colour only. Backgrounds, foregrounds and the fixed
# semantic colours (battery red, disk orange, ...) stay hand-written in the real
# config files, which import these generated files and can override anything.
#
# Regenerate with hypr/scripts/set-wallpaper.sh -- never edit the outputs.

[config]

[templates.waybar]
input_path  = '~/dotfiles/matugen/templates/colors-waybar.css'
output_path = '~/dotfiles/waybar/colors.css'

[templates.rofi]
input_path  = '~/dotfiles/matugen/templates/colors-rofi.rasi'
output_path = '~/dotfiles/rofi/styles/colors.rasi'

[templates.hyprlock]
input_path  = '~/dotfiles/matugen/templates/colors-hypr.conf'
output_path = '~/dotfiles/hypr/colors.conf'

[templates.hyprland]
input_path  = '~/dotfiles/matugen/templates/colors-hypr.lua'
output_path = '~/dotfiles/hypr/colors.lua'

[templates.mako]
input_path  = '~/dotfiles/matugen/templates/colors-mako'
output_path = '~/dotfiles/mako/colors'

[templates.alacritty]
input_path  = '~/dotfiles/matugen/templates/colors-alacritty.toml'
output_path = '~/dotfiles/alacritty/colors.toml'

# GTK3 and GTK4 read their own gtk.css; both import the generated file next to
# it. Same template, two destinations.
[templates.gtk3]
input_path  = '~/dotfiles/matugen/templates/colors-gtk.css'
output_path = '~/dotfiles/gtk-3.0/colors.css'

[templates.gtk4]
input_path  = '~/dotfiles/matugen/templates/colors-gtk.css'
output_path = '~/dotfiles/gtk-4.0/colors.css'
