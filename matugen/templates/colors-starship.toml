# GENERATED BY MATUGEN -- DO NOT EDIT. Regenerate: hypr/scripts/set-wallpaper.sh
#
# Starship's TOML has no include directive, so this file is not imported -- it is
# CONCATENATED onto starship/starship.base.toml by starship/build.sh. That is also
# why the whole [palettes.dots] table lives here: TOML forbids a repeated table
# header, so the fixed colours below cannot be split off into the base file.
#
# The prompt is starship's gruvbox-rainbow preset with its gruvbox_dark palette
# replaced by matugen. That preset chains six visibly different segments
# (orange -> yellow -> aqua -> blue -> bg3 -> bg1), which a Material scheme cannot
# supply on its own: every role is generated from ONE source hue, so
# primary/secondary/tertiary land within a few degrees of each other and the
# chain collapses into one flat band.
#
# The fix is matugen's custom_colors with blend = true (see matugen/config.toml):
# each seed keeps its own hue but is harmonized toward the wallpaper. The four
# hue_* entries below are the *_container variants -- dark and saturated, taking
# light text, which is the weight gruvbox-rainbow itself uses. The bright
# variants are vivid pastels needing dark text; see the commented block.
[palettes.dots]
# --- the four coloured segments -------------------------------------------
hue_red    = "{{colors.rainbow_red_container.dark.hex}}"     # os + username  (was color_orange)
hue_orange = "{{colors.rainbow_orange_container.dark.hex}}"  # directory      (was color_yellow)
hue_green  = "{{colors.rainbow_green_container.dark.hex}}"   # git            (was color_aqua)
hue_cyan   = "{{colors.rainbow_cyan_container.dark.hex}}"    # languages      (was color_blue)
# Text on all four. Material guarantees this against the container tones.
on_hue     = "{{colors.on_surface.dark.hex}}"

# --- vivid alternative ----------------------------------------------------
# Swap these five lines in for the five above to get the bright variant: vivid
# pastel segments with near-black text. Much louder, maximum separation between
# segments. Nothing else in starship.base.toml has to change.
#
# hue_red    = "{{colors.rainbow_red.dark.hex}}"
# hue_orange = "{{colors.rainbow_orange.dark.hex}}"
# hue_green  = "{{colors.rainbow_green.dark.hex}}"
# hue_cyan   = "{{colors.rainbow_cyan.dark.hex}}"
# on_hue     = "#141C21"

# --- spare hues -----------------------------------------------------------
# Unused by the default chain, same as gruvbox_dark's own color_purple. Wired up
# for the optional segments at the bottom of starship.base.toml.
hue_blue   = "{{colors.rainbow_blue_container.dark.hex}}"
hue_purple = "{{colors.rainbow_purple_container.dark.hex}}"

# --- the two dark tail segments -------------------------------------------
# Greys, so these stay on the plain surface ramp -- gruvbox's bg3/bg1 are grey too.
surface_bright    = "{{colors.surface_bright.dark.hex}}"     # docker/conda (was color_bg3)
surface_container = "{{colors.surface_container.dark.hex}}"  # time         (was color_bg1)
on_surface        = "{{colors.on_surface.dark.hex}}"         #              (was color_fg0)

# --- error ----------------------------------------------------------------
error    = "{{colors.error.dark.hex}}"
on_error = "{{colors.on_error.dark.hex}}"

# --- fixed: hand-written semantic colours ---------------------------------
# Per matugen/config.toml's rule, semantic colours stay hand-written. These are
# the desktop base from alacritty/alacritty.toml. gruvbox-rainbow uses
# color_green/color_red for the prompt character for exactly this reason: a
# success/failure signal must not drift to whatever hue the wallpaper happens
# to be, or it stops meaning anything.
green   = "#61C766"
red     = "#EC7875"
yellow  = "#FDD835"
cyan    = "#4DD0E1"
base_bg = "#141C21"
