# --- docker / env slot ----------------------------------------------------

[docker_context]
symbol = ""
style = "bg:surface_bright"
format = '[[ $symbol( $context) ](fg:on_surface bg:surface_bright)]($style)'

# POWERLEVEL9K_ANACONDA: p10k stripped the "(...)" that CONDA_PROMPT_MODIFIER
# wraps the env name in, and showed the base env too.
[conda]
symbol = " "
style = "bg:surface_bright"
format = '[[ $symbol$environment ](fg:on_surface bg:surface_bright)]($style)'
ignore_base = false
truncation_length = 1

[pixi]
style = "bg:surface_bright"
format = '[[ $symbol( $version)( $environment) ](fg:on_surface bg:surface_bright)]($style)'

# POWERLEVEL9K_TIME_FORMAT='%D{%H:%M:%S}'. The preset uses %R (HH:MM); p10k
# showed seconds, so that is kept.
[time]
disabled = false
time_format = "%H:%M:%S"
style = "bg:surface_container"
format = '[[ 󰥔 $time ](fg:on_surface bg:surface_container)]($style)'

[line_break]
disabled = false

# POWERLEVEL9K_PROMPT_CHAR: ❯ insert, ❮ command, V visual, ▶ overwrite, with
# foreground 76 (green) on success and 196 (red) on failure. The preset uses its
# own green/red for the same reason: a success signal must not follow the
# wallpaper, or it stops meaning anything.
[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_visual_symbol = '[V](bold fg:yellow)'
vimcmd_replace_symbol = '[▶](bold fg:red)'
vimcmd_replace_one_symbol = '[▶](bold fg:red)'

# ---------------------------------------------------------------------------
# right prompt -- not part of the preset, see the note on right_format
# ---------------------------------------------------------------------------

# POWERLEVEL9K_STATUS_OK=false (silent on success), '✘' on failure, with
# ERROR_PIPE/OK_PIPE reporting the whole pipeline.
[status]
disabled = false
style = "fg:on_error bg:error"
format = '[](fg:error)[ $symbol$status ]($style)'
symbol = "✘"
success_symbol = ""
not_executable_symbol = "✘"
not_found_symbol = "✘"
sigint_symbol = "✘"
signal_symbol = "✘"
# POWERLEVEL9K_STATUS_VERBOSE_SIGNAME=false
map_symbol = false
recognize_signal_code = true
pipestatus = true
pipestatus_format = '[](fg:error)[ $symbol$pipestatus ]($style)'

# POWERLEVEL9K_COMMAND_EXECUTION_TIME_THRESHOLD=3, PRECISION=0.
[cmd_duration]
min_time = 3000
show_milliseconds = false
style = "fg:on_hue bg:hue_orange"
format = '[](fg:hue_orange)[ 󱎫 $duration ]($style)'
# Desktop notification when a long command finishes -- you run matugen and
# wallpaper jobs from the shell, and mako is already configured.
# show_notifications = true
# min_time_to_notify = 45000

# POWERLEVEL9K_BACKGROUND_JOBS with VERBOSE=false: a bare symbol until there is
# more than one job.
[jobs]
style = "fg:on_surface bg:surface_bright"
format = '[](fg:surface_bright)[ $symbol$number ]($style)'
symbol = ""
number_threshold = 2
symbol_threshold = 1

# ---------------------------------------------------------------------------
# extras -- not in the preset and not in the old p10k config. Uncomment one at a
# time; each needs its $module added to `format` or `right_format`.
# ---------------------------------------------------------------------------

# Lines added/removed in the working tree. Add ($git_metrics) to right_format.
# [git_metrics]
# disabled = false
# added_style = "fg:green bg:surface_bright"
# deleted_style = "fg:red bg:surface_bright"
# format = '[](fg:surface_bright)[ +$added]($added_style)[ -$deleted ]($deleted_style)'

# Nesting depth. p10k had dedicated `ranger`/`vim_shell` segments for this, and
# your `r` alias drops you into a subshell. Add ($shlvl) to right_format.
# [shlvl]
# disabled = false
# threshold = 2
# symbol = "❯"
# repeat = false
# style = "fg:on_surface bg:surface_bright"
# format = '[](fg:surface_bright)[ $symbol$shlvl ]($style)'

# Warns while a sudo timestamp is still valid. Add ($sudo) to right_format.
# [sudo]
# disabled = false
# style = "fg:on_error bg:error"
# format = '[](fg:error)[ $symbol ]($style)'
# symbol = "󰒃 "

# Transient prompt: collapse past prompts to a bare ❯ so scrollback stays clean.
# POWERLEVEL9K_TRANSIENT_PROMPT was `off`, so this is off here too. Needs
# `enable_transience` in .zshrc AFTER `eval "$(starship init zsh)"`.

# GENERATED BY MATUGEN -- DO NOT EDIT. Regenerate: hypr/scripts/set-wallpaper.sh
#
# Starship's TOML has no include directive, so this file is not imported -- it is
# CONCATENATED onto starship/starship.base.toml by starship/build.sh. That is also
# why the whole [palettes.dots] table lives here: TOML forbids a repeated table
# header, so the fixed colours below cannot be split off into the base file.
#
# The prompt is starship's gruvbox-rainbow preset with its gruvbox_dark palette
# replaced by matugen. That preset chains six visibly different segments
# (orange -> yellow -> aqua -> blue -> bg3 -> bg1), which a Material scheme cannot
# supply on its own: every role is generated from ONE source hue, so
# primary/secondary/tertiary land within a few degrees of each other and the
# chain collapses into one flat band.
#
# The fix is matugen's custom_colors with blend = true (see matugen/config.toml):
# each seed keeps its own hue but is harmonized toward the wallpaper. The four
# hue_* entries below are the *_container variants -- dark and saturated, taking
# light text, which is the weight gruvbox-rainbow itself uses. The bright
# variants are vivid pastels needing dark text; see the commented block.
[palettes.dots]
# --- the four coloured segments -------------------------------------------
hue_red    = "#7c2e00"     # os + username  (was color_orange)
hue_orange = "#653e00"  # directory      (was color_yellow)
hue_green  = "#2f4f00"   # git            (was color_aqua)
hue_cyan   = "#005045"    # languages      (was color_blue)
# Text on all four. Material guarantees this against the container tones.
on_hue     = "#ebe2cb"

# --- vivid alternative ----------------------------------------------------
# Swap these five lines in for the five above to get the bright variant: vivid
# pastel segments with near-black text. Much louder, maximum separation between
# segments. Nothing else in starship.base.toml has to change.
#
# hue_red    = "#ffb595"
# hue_orange = "#ffb95c"
# hue_green  = "#8adc00"
# hue_cyan   = "#00dfc3"
# on_hue     = "#141C21"

# --- spare hues -----------------------------------------------------------
# Unused by the default chain, same as gruvbox_dark's own color_purple. Wired up
# for the optional segments at the bottom of starship.base.toml.
hue_blue   = "#004a77"
hue_purple = "#790095"

# --- the two dark tail segments -------------------------------------------
# Greys, so these stay on the plain surface ramp -- gruvbox's bg3/bg1 are grey too.
surface_bright    = "#3e3929"     # docker/conda (was color_bg3)
surface_container = "#231f11"  # time         (was color_bg1)
on_surface        = "#ebe2cb"         #              (was color_fg0)

# --- error ----------------------------------------------------------------
error    = "#ffb4ab"
on_error = "#690005"

# --- fixed: hand-written semantic colours ---------------------------------
# Per matugen/config.toml's rule, semantic colours stay hand-written. These are
# the desktop base from alacritty/alacritty.toml. gruvbox-rainbow uses
# color_green/color_red for the prompt character for exactly this reason: a
# success/failure signal must not drift to whatever hue the wallpaper happens
# to be, or it stops meaning anything.
green   = "#61C766"
red     = "#EC7875"
yellow  = "#FDD835"
cyan    = "#4DD0E1"
base_bg = "#141C21"
