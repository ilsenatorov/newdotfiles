# hyprpaper -- replaces `nitrogen --restore` from the i3 autostart.
# nitrogen was set to mode 5 (zoom-fill) on ~/Pictures/wallpaper.jpg for every monitor,
# which is `cover:` here.

preload = ~/Pictures/wallpaper.jpg

# empty monitor field = all outputs
wallpaper = ,cover:~/Pictures/wallpaper.jpg

splash = false
ipc = on
