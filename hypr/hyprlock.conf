# hyprlock -- replaces the i3 lock flow (scrot + `convert -blur 0x8` + i3lock -i).
# hyprlock takes and blurs the screenshot itself, so no temp files in /tmp.
# Colours come from the generated colors.conf: the fixed base from
# matugen/base.json plus the wallpaper accent.

# Generated by matugen. Reassign $accent (or any other colour) below this
# line to override it.
source = ~/.config/hypr/colors.conf

$font = MesloLGS NF

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8

    # frosted glass rather than plain gaussian blur
    noise      = 0.0117
    contrast   = 0.9
    brightness = 0.75
    vibrancy   = 0.17
    vibrancy_darkness = 0.05
}

# NOTE: no `shape` widget here -- hyprlock 0.9.6 only recognises background,
# input-field and label (checked against the binary). The dimming that a shape
# would have provided comes from background{ brightness } instead.

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 12

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = $accent
    inner_color = $bg
    font_color  = $fg
    check_color = $yellow
    fail_color  = $urgent

    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $fg
    font_size = 64
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $dim
    font_size = 18
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}
