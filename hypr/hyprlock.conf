# hyprlock -- replaces the i3 lock flow (scrot + `convert -blur 0x8` + i3lock -i).
# hyprlock takes and blurs the screenshot itself, so no temp files in /tmp.
# Colours from ../polybar/colors.ini.

$font = Iosevka Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgb(4DD0E1)
    inner_color = rgb(141C21)
    font_color  = rgb(93A1A1)
    check_color = rgb(FDD835)
    fail_color  = rgb(EC7875)

    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(93A1A1)
    font_size = 64
    font_family = $font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgb(6D8895)
    font_size = 18
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}
