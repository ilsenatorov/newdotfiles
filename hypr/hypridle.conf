general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'

    # Honour inhibitors instead of locking mid-video / mid-build.
    #   dbus    -> org.freedesktop.ScreenSaver, what browsers raise on playback
    #   systemd -> `systemd-inhibit --what=idle <cmd>`, for long jobs
    # Both default to false already; pinned here so a default change upstream
    # cannot silently reintroduce the 30-minute suspend during a training run.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# dim the backlight after 2.5 min
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# lock after 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screen off shortly after locking
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# suspend after 30 min
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
