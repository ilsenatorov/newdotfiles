# GTK3 apps (pavucontrol, nm-applet menus, nautilus, every GTK file dialog)
# had NO config at all and fell back to light Adwaita on a #141C21 desktop.
#
# Under Wayland there is no XSettings daemon, so this file is what GTK3 reads.
# GTK4/libadwaita ignores it -- see gtk-4.0/settings.ini -- and both are also
# pushed through gsettings by hypr/scripts/gsettings-theme.sh at session start,
# which is the only channel libadwaita and xdg-desktop-portal-gtk listen on.
#
# Adwaita-dark ships with GTK3 itself, so this cannot break on an update.
# For a closer match to modern libadwaita apps, install `adw-gtk3` and set
# gtk-theme-name=adw-gtk3-dark here and in gsettings-theme.sh.
[Settings]
gtk-theme-name=Adwaita-dark
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Cantarell 11
gtk-enable-animations=true
gtk-decoration-layout=:close
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
